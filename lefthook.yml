pre-commit:
  parallel: true
  commands:
    lint:
      root: 'apps/web/'
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files} && pnpm exec eslint {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,json,md,yml,yaml,css}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      root: 'apps/web/'
      glob: '*.{ts,tsx}'
      run: pnpm typecheck
    spell:
      root: 'apps/web/'
      glob: '*.{ts,tsx}'
      run: pnpm exec cspell {staged_files}
    knip:
      root: 'apps/web/'
      glob: '*.{ts,tsx,json}'
      run: pnpm knip
